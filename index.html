<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="เล่นกับแมว ตามหาความลับ แล้วเปิดของขวัญ">
<meta name="theme-color" content="#12283B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐈‍⬛</text></svg>">
<title>เล่นกับแมว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Noto+Sans+Thai+Looped:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #12283B; --sky-bottom: #21446A;
    --text: #F4EDD8; --muted: #B3C0D2;
    --amber: #FFC44D; --amber-ink: #2A1A00;
    --line: rgba(244, 237, 216, .4);
    --dot: rgba(244, 237, 216, .28);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky-top: #0A1521; --sky-bottom: #162C44; } }
  :root[data-theme="dark"] { --sky-top: #0A1521; --sky-bottom: #162C44; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)) fixed;
    background-color: var(--sky-top);
    color: var(--text);
    font-family: "Noto Sans Thai Looped", "Sarabun", Tahoma, sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    padding: 28px 20px;
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  @media (min-width: 860px) { main { max-width: 560px; } }
  .step { display: flex; justify-content: center; gap: 8px; margin: 0 0 16px; }
  .step span { width: 8px; height: 8px; border-radius: 99px; background: var(--dot); transition: width .2s ease, background .2s ease; }
  .step span.on { width: 26px; background: var(--amber); }
  h1 {
    font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif;
    font-weight: 400; font-size: clamp(1.7rem, 6.6vw, 2.4rem);
    line-height: 1.4; margin: 4px 0 6px; text-wrap: balance;
  }
  .sub { font-size: 1rem; line-height: 1.75; color: var(--muted); margin: 0 auto 6px; max-width: 32ch; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 52px; min-width: 116px; padding: 10px 30px;
    border-radius: 999px; font: 600 1.05rem "Noto Sans Thai Looped", Tahoma, sans-serif;
    text-decoration: none; cursor: pointer; border: 2px solid transparent;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .15s ease, filter .15s ease, border-color .15s ease;
  }
  .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .btn-main { background: var(--amber); color: var(--amber-ink); }
  .btn-main:hover { filter: brightness(1.08); transform: translateY(-2px); }
  .btn-alt { background: rgba(244,237,216,.08); color: var(--text); border-color: var(--line); }
  .actions { display: flex; justify-content: center; margin-top: 20px; }
  .counter { font: 600 1rem "Noto Sans Thai Looped", Tahoma, sans-serif; color: var(--amber); margin: 10px 0 0; }
  .stage {
    position: relative; width: 100%; max-width: 380px; height: 260px;
    margin: 18px auto 0; border-radius: 22px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 15%, #23456B, transparent 60%), linear-gradient(180deg, #16324B, #0E2338);
    border: 2px solid rgba(255, 196, 77, .38);
  }
  .stage .star-bg { position: absolute; border-radius: 50%; background: #FBF3DC; animation: twinkleFlicker linear infinite; }
  @keyframes twinkleFlicker { 0%, 100% { opacity: .14; } 50% { opacity: .55; } }
  .pet-stage { height: 300px; display: flex; align-items: flex-end; justify-content: center; }
  .pet-cat { width: min(72%, 230px); position: relative; }
  .pet-cat svg { width: 100%; height: auto; display: block; overflow: visible; }
  .hit-head, .hit-tail { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pupil { transition: transform .08s linear; }
  .tail-g { transform-box: fill-box; transform-origin: 0% 100%; animation: tailSwish 1.6s ease-in-out infinite; }
  .tail-g.flick { animation: tailFlick .4s ease-in-out 2; }
  @keyframes tailSwish { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  @keyframes tailFlick { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(20deg); } }
  .eyes-open, .eyes-purr, .eyes-annoyed, .mouth-n, .mouth-purr, .mouth-annoyed { transition: opacity .12s ease; }
  .eyes-purr, .mouth-purr, .eyes-annoyed, .mouth-annoyed { opacity: 0; }
  .pet-cat[data-mood="purr"] .eyes-open, .pet-cat[data-mood="purr"] .mouth-n { opacity: 0; }
  .pet-cat[data-mood="purr"] .eyes-purr, .pet-cat[data-mood="purr"] .mouth-purr { opacity: 1; }
  .pet-cat[data-mood="annoyed"] .eyes-open, .pet-cat[data-mood="annoyed"] .mouth-n { opacity: 0; }
  .pet-cat[data-mood="annoyed"] .eyes-annoyed, .pet-cat[data-mood="annoyed"] .mouth-annoyed { opacity: 1; }
  .moon-btn { position: absolute; top: 5%; right: 7%; font-size: 2.1rem; line-height: 1; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .25s ease; filter: drop-shadow(0 0 10px rgba(255, 243, 208, .55)); }
  .moon-btn.pulse { animation: moonPulse .5s ease; }
  @keyframes moonPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  .twinkle { position: absolute; border-radius: 50%; background: #FBF3DC; animation: pop .4s ease; }
  .twinkle.bright { background: #FFF8E6; box-shadow: 0 0 10px 3px rgba(255, 243, 208, .85); }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); } }
  .star-btn { position: absolute; font-size: 1.25rem; line-height: 1; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transform: translate(-50%, -50%); filter: drop-shadow(0 0 5px rgba(255, 235, 180, .8)); }
  .star-btn.falling { animation: starFall .55s ease-in forwards; }
  @keyframes starFall { to { transform: translate(calc(-50% + 55px), calc(-50% + 90px)) scale(.3); opacity: 0; } }
  .ask-more { margin-top: 18px; padding: 14px 16px; border-radius: 18px; border: 2px dashed var(--line); background: rgba(244, 237, 216, .06); }
  .ask-more p { font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif; font-size: 1.1rem; margin: 0 0 12px; color: var(--amber); }
  .ask-more .actions { margin-top: 0; gap: 10px; }
  .ask-more .btn { min-width: 96px; min-height: 44px; padding: 8px 18px; font-size: .95rem; }
  .score-card { width: min(100%, 380px); margin: 18px auto 0; padding: 0; border: 0; border-radius: 0; background: transparent; text-align: center; }
  .score-title { margin: 0 0 10px; text-align: center; font-size: 1.05rem; line-height: 1.6; color: var(--text); }
  .score-value { display: block; text-align: center; color: var(--amber); font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif; font-size: clamp(3.4rem, 14vw, 4.6rem); font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; margin: 4px 0 8px; }
  .score-slider {
    display: block !important; visibility: visible !important; opacity: 1 !important;
    position: relative; z-index: 2; -webkit-appearance: none; appearance: none;
    --pct: 50%; width: 100%; min-height: 36px; height: 36px; margin: 10px 0 0; padding: 0;
    background: transparent; cursor: pointer; touch-action: pan-y;
  }
  .score-slider::-webkit-slider-runnable-track { height: 12px; border-radius: 99px; background: linear-gradient(90deg, var(--amber) var(--pct, 50%), rgba(244,237,216,.22) var(--pct, 50%)); }
  .score-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 30px; height: 30px; margin-top: -9px; border-radius: 50%; background: var(--amber); border: 3px solid #FFF3D0; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .score-slider::-moz-range-track { height: 12px; border-radius: 99px; background: rgba(244,237,216,.22); }
  .score-slider::-moz-range-progress { height: 12px; border-radius: 99px; background: var(--amber); }
  .score-slider::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--amber); border: 3px solid #FFF3D0; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .score-slider:focus-visible { outline: 3px solid var(--text); outline-offset: 6px; border-radius: 99px; }
  .score-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .score-popup { min-height: 56px; display: flex; align-items: center; justify-content: center; text-align: center; margin-top: 14px; padding: 12px; border-radius: 14px; background: rgba(255,196,77,.12); color: var(--amber); line-height: 1.7; }
  @media (min-width: 860px) { .score-card { margin-left: auto; margin-right: auto; } }
  .floatup { position: absolute; font-size: 1.5rem; pointer-events: none; animation: floatUp 1s ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -46px); } }
  .meter { width: min(100%, 340px); height: 14px; margin: 16px auto 0; border-radius: 99px; background: rgba(244, 237, 216, .18); overflow: hidden; }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--amber), #FF9E7A); transition: width .35s ease; }
  .hunt-obj {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 1.05rem; line-height: 1; background: none; border: 0; padding: 7px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    animation: twinkleFlicker linear infinite;
    filter: grayscale(55%) drop-shadow(0 0 3px rgba(255, 255, 255, .25));
  }
  .hunt-obj.found { animation: none; filter: none; transform: translate(-50%, -50%) scale(1.8); opacity: 0; transition: transform .4s ease, opacity .4s ease; }
  .hunt-obj.miss { filter: brightness(1.9) grayscale(0%); }
  .meteor-shower { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 25; }
  .meteor { position: absolute; top: -6%; width: 7px; height: 7px; border-radius: 50%; background: #FFF3D0; box-shadow: 0 0 10px 3px rgba(255, 196, 77, .75); animation: meteorFall var(--d) linear var(--dl) forwards; }
  @keyframes meteorFall { 0% { opacity: 1; } 14% { opacity: .15; } 28% { opacity: 1; } 42% { opacity: .15; } 56% { opacity: 1; } 70% { opacity: .15; } 85% { opacity: 1; } 100% { transform: translate(var(--dx), 120vh); opacity: 0; } }
  .giftbox-wrap { margin: 22px 0 6px; }
  .giftbox { font-size: 5.2rem; line-height: 1; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .25s ease; touch-action: manipulation; }
  .giftbox:hover { transform: translateY(-3px); }
  .giftbox.open { transform: scale(1.12) rotate(-4deg); pointer-events: none; }
  .giftbox.shake { animation: boxShake .4s ease; }
  @keyframes boxShake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
  .shake-hint { color: var(--muted); font-size: .92rem; margin: 8px 0 0; min-height: 1.4em; }
  .gift-lines { min-height: 96px; margin-top: 8px; }
  .gift-lines p { font-size: 1.08rem; line-height: 1.8; color: var(--text); margin: 0 0 6px; opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease; }
  .gift-lines p.show { opacity: 1; transform: none; }
  .gift-more { opacity: 0; transition: opacity .5s ease; }
  .gift-more.show { opacity: 1; }
  .scratch { position: relative; width: min(100%, 380px); height: 160px; margin: 22px auto 0; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #183149, #0F2233); border: 2px solid rgba(255, 196, 77, .5); }
  .scratch-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px 20px; text-align: center; font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif; font-size: clamp(1.25rem, 5vw, 1.6rem); line-height: 1.55; color: var(--amber); }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: opacity .6s ease; }
  .scratch canvas:focus-visible { outline: 3px solid var(--text); outline-offset: -3px; }
  .scratch canvas.gone { opacity: 0; pointer-events: none; }
  .scratch-hint { color: var(--muted); font-size: .92rem; margin-top: 10px; }
  .envelope-wrap { margin: 22px 0 4px; }
  .envelope-btn { font-size: 4.6rem; line-height: 1; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .25s ease; touch-action: manipulation; }
  .envelope-btn:hover { transform: translateY(-3px); }
  .envelope-btn.opened { transform: scale(1.1) rotate(-3deg); pointer-events: none; }
  .letter-note { min-height: 100px; margin-top: 10px; }
  .letter-note p { font-size: 1.06rem; line-height: 1.85; color: var(--text); margin: 0 0 6px; opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease; }
  .letter-note p.show { opacity: 1; transform: none; }
  .plead-line { font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif; font-size: clamp(1.15rem, 4.6vw, 1.4rem); color: var(--amber); margin: 18px auto 0; max-width: 30ch; line-height: 1.6; opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease; }
  .plead-line.show { opacity: 1; transform: none; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .confetti span { position: absolute; top: -10%; font-size: 1.4rem; animation: heartFall var(--d) linear var(--dl) forwards; }
  @keyframes heartFall { to { transform: translateY(120vh) rotate(var(--r)); opacity: 0; } }
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(6, 14, 24, .62);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .modal {
    width: min(100%, 360px);
    text-align: center;
    background: linear-gradient(180deg, #1B3550, #12283B);
    border: 2px solid rgba(255, 196, 77, .55);
    border-radius: 24px;
    padding: 22px 22px 24px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    color: #F4EDD8;
  }
  .modal .modal-icon { font-size: 2rem; margin: 0 0 4px; }
  .modal p {
    font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif;
    font-size: clamp(1.15rem, 5vw, 1.45rem);
    line-height: 1.6;
    margin: 0 0 18px;
  }
  @media (prefers-reduced-motion: reduce) {
    .tail-g, .floatup, .hunt-obj, .stage .star-bg, .meteor, .confetti span, .moon-btn.pulse, .twinkle, .star-btn.falling, .giftbox.shake { animation: none !important; }
    .plead-line, .pupil { transition: none; }
    .scratch canvas, .gift-lines p, .gift-more, .giftbox, .btn, .letter-note p, .envelope-btn { transition: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="minicat" viewBox="0 0 220 180">
    <path d="M44 66 L48 20 L100 44 Z M176 66 L172 20 L120 44 Z" fill="#0C0C12" stroke="#23233A" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="110" cy="90" rx="74" ry="58" fill="#0C0C12" stroke="#23233A" stroke-width="3"/>
    <circle cx="80" cy="86" r="13" fill="#FFC44D"/><circle cx="140" cy="86" r="13" fill="#FFC44D"/>
    <ellipse cx="80" cy="86" rx="4" ry="10" fill="#0C0C12"/><ellipse cx="140" cy="86" rx="4" ry="10" fill="#0C0C12"/>
    <path d="M104 104 L116 104 L110 110 Z" fill="#D9788F"/>
    <path d="M110 110 Q104 118 96 113 M110 110 Q116 118 124 113" stroke="#B9B4D6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g fill="#0C0C12" stroke="#23233A" stroke-width="3"><ellipse cx="84" cy="160" rx="22" ry="12"/><g class="paw-r"><ellipse cx="136" cy="160" rx="22" ry="12"/></g></g>
  </symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#FF6F97"/></symbol>
</svg>
<main><div class="step" id="step"></div><div id="view"></div></main>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="meteor-shower" id="meteors" aria-hidden="true"></div>
<script>
  var TOTAL = 6;
  var view = document.getElementById('view');
  var stepBox = document.getElementById('step');
  var confetti = document.getElementById('confetti');
  var meteorBox = document.getElementById('meteors');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function buildStep() { stepBox.textContent = ''; for (var i = 1; i <= TOTAL; i++) stepBox.appendChild(document.createElement('span')); }
  function updateStep(n) { var spans = stepBox.children; for (var i = 0; i < spans.length; i++) spans[i].className = (i + 1 === n) ? 'on' : ''; }
  function heartBurst() {
    if (reduceMotion) return;
    for (var i = 0; i < 20; i++) { var s = el('span', '', i % 2 ? '🖤' : '💛'); s.style.left = (Math.random() * 96) + '%'; s.style.setProperty('--d', (2.4 + Math.random() * 1.8) + 's'); s.style.setProperty('--dl', (Math.random() * 0.8) + 's'); s.style.setProperty('--r', (Math.random() * 360) + 'deg'); confetti.appendChild(s); }
    setTimeout(function () { confetti.textContent = ''; }, 5000);
  }
  function meteorShower(done) {
    if (reduceMotion) { done(); return; }
    for (var i = 0; i < 16; i++) { var m = el('div', 'meteor'); m.style.left = (Math.random() * 100) + '%'; m.style.setProperty('--d', (0.7 + Math.random() * 0.5) + 's'); m.style.setProperty('--dl', (Math.random() * 0.5) + 's'); m.style.setProperty('--dx', rand(40, 140) + 'px'); meteorBox.appendChild(m); }
    setTimeout(function () { meteorBox.textContent = ''; done(); }, 1400);
  }

  function showModal(text, closeLabel, onClose) {
    var back = el('div', 'modal-backdrop');
    back.id = 'modal';
    var box = el('div', 'modal');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.appendChild(el('div', 'modal-icon', '💌'));
    box.appendChild(el('p', '', text));
    var btn = el('button', 'btn btn-main', closeLabel || 'ไปต่อ');
    btn.type = 'button';
    box.appendChild(btn);
    back.appendChild(box);
    document.body.appendChild(back);
    btn.addEventListener('click', function () {
      back.remove();
      if (onClose) onClose();
    });
    btn.focus({ preventScroll: true });
  }

  var CAT_SVG =
    '<svg viewBox="0 0 240 210" role="img" aria-label="แมวดำให้เล่นด้วย">' +
    '<ellipse cx="120" cy="150" rx="82" ry="56" fill="#0C0C12" stroke="#23233A" stroke-width="3"/>' +
    '<g class="tail-g"><path d="M188 168 Q230 150 224 98 Q220 70 198 66" fill="none" stroke="#0C0C12" stroke-width="20" stroke-linecap="round"/><path class="hit-tail" d="M188 168 Q230 150 224 98 Q220 70 198 66" fill="none" stroke="#000" stroke-opacity="0" stroke-width="46" stroke-linecap="round" pointer-events="all"/></g>' +
    '<path d="M62 96 L66 34 L118 62 Z M178 96 L174 34 L122 62 Z" fill="#0C0C12" stroke="#23233A" stroke-width="3" stroke-linejoin="round"/><path d="M73 86 L74 52 L104 68 Z M167 86 L166 52 L136 68 Z" fill="#3A2A44"/>' +
    '<circle cx="120" cy="98" r="58" fill="#0C0C12" stroke="#23233A" stroke-width="3"/>' +
    '<g class="eyes-open"><circle cx="98" cy="94" r="10" fill="#FFC44D"/><circle cx="142" cy="94" r="10" fill="#FFC44D"/><ellipse class="pupil" cx="98" cy="94" rx="3.2" ry="8" fill="#0C0C12"/><ellipse class="pupil" cx="142" cy="94" rx="3.2" ry="8" fill="#0C0C12"/></g>' +
    '<g class="eyes-purr"><path d="M88 94 Q98 84 108 94 M132 94 Q142 84 152 94" stroke="#FFC44D" stroke-width="4.5" stroke-linecap="round" fill="none"/></g>' +

    var wrap = el('div', 'scratch'); var msg = el('div', 'scratch-msg', 'ผมชอบคุณ > 100 อีกนะ อยู่กับผมนานๆนะครับเบบี๋ 😳'); var canvas = document.createElement('canvas'); canvas.tabIndex = 0; canvas.setAttribute('aria-label', 'ขูดเพื่อเปิดข้อความ'); wrap.appendChild(msg); wrap.appendChild(canvas); view.appendChild(wrap); view.appendChild(el('p', 'scratch-hint', 'ลองขูดที่กล่องด้านบนดูสิครับ'));
    makeScratch(wrap, canvas, 0.8, function () { var hint = view.querySelector('.scratch-hint'); if (hint) hint.remove(); heartBurst(); var plead = el('p', 'plead-line', 'ตกหลุมรักผมได้แล้วมั้งครับเบบี๋ 🖤'); view.appendChild(plead); requestAnimationFrame(function () { plead.classList.add('show'); }); });
  }
  var PAGES = { play: renderGame, hunt: renderHunt, gift: renderGift, letter: renderLetter, score: renderScore, final: renderFinal };
  function route() { var h = (location.hash || '').replace('#', ''); (PAGES[h] || renderGame)(); }
  buildStep(); window.addEventListener('hashchange', route); route();
</script>
