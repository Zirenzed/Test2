<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="เล่นกับแมว ตามหาความลับ แล้วเปิดของขวัญ">
<meta name="theme-color" content="#12283B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐈‍⬛</text></svg>">
<title>เล่นกับแมว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Noto+Sans+Thai+Looped:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #12283B; --sky-bottom: #21446A;
    --text: #F4EDD8; --muted: #B3C0D2;
    --amber: #FFC44D; --amber-ink: #2A1A00;
    --line: rgba(244, 237, 216, .4);
    --dot: rgba(244, 237, 216, .28);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky-top: #0A1521; --sky-bottom: #162C44; } }
  :root[data-theme="dark"] { --sky-top: #0A1521; --sky-bottom: #162C44; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)) fixed;
    background-color: var(--sky-top);
    color: var(--text);
    font-family: "Noto Sans Thai Looped", "Sarabun", Tahoma, sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    padding: 28px 20px;
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  @media (min-width: 860px) { main { max-width: 560px; } }

  .step { display: flex; justify-content: center; gap: 8px; margin: 0 0 16px; }
  .step span { width: 8px; height: 8px; border-radius: 99px; background: var(--dot); transition: width .2s ease, background .2s ease; }
  .step span.on { width: 26px; background: var(--amber); }

  h1 {
    font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif;
    font-weight: 400; font-size: clamp(1.7rem, 6.6vw, 2.4rem);
    line-height: 1.4; margin: 4px 0 6px; text-wrap: balance;
  }
  .sub { font-size: 1rem; line-height: 1.75; color: var(--muted); margin: 0 auto 6px; max-width: 32ch; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 52px; min-width: 116px; padding: 10px 30px;
    border-radius: 999px; font: 600 1.05rem "Noto Sans Thai Looped", Tahoma, sans-serif;
    text-decoration: none; cursor: pointer; border: 2px solid transparent;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .15s ease, filter .15s ease, border-color .15s ease;
  }
  .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .btn-main { background: var(--amber); color: var(--amber-ink); }
  .btn-main:hover { filter: brightness(1.08); transform: translateY(-2px); }
  .actions { display: flex; justify-content: center; margin-top: 20px; }

  .counter { font: 600 1rem "Noto Sans Thai Looped", Tahoma, sans-serif; color: var(--amber); margin: 10px 0 0; }

  /* ---- stage (shared by game 1 & 2) ---- */
  .stage {
    position: relative; width: 100%; max-width: 380px; height: 260px;
    margin: 18px auto 0; border-radius: 22px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 15%, #23456B, transparent 60%), linear-gradient(180deg, #16324B, #0E2338);
    border: 2px solid rgba(255, 196, 77, .38);
  }
  .stage .star-bg { position: absolute; border-radius: 50%; background: #FBF3DC; opacity: .5; }

  /* interactive cat (pet head / catch tail) */
  .pet-stage { height: 300px; display: flex; align-items: flex-end; justify-content: center; }
  .pet-cat { width: min(72%, 230px); position: relative; }
  .pet-cat svg { width: 100%; height: auto; display: block; overflow: visible; }
  .hit-head, .hit-tail { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tail-g { transform-box: fill-box; transform-origin: 0% 100%; animation: tailSwish 1.6s ease-in-out infinite; }
  .tail-g.flick { animation: tailFlick .4s ease-in-out 2; }
  @keyframes tailSwish { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  @keyframes tailFlick { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(20deg); } }
  .eyes-open, .eyes-purr, .eyes-annoyed, .mouth-n, .mouth-purr, .mouth-annoyed { transition: opacity .12s ease; }
  .eyes-purr, .mouth-purr, .eyes-annoyed, .mouth-annoyed { opacity: 0; }
  .pet-cat[data-mood="purr"] .eyes-open, .pet-cat[data-mood="purr"] .mouth-n { opacity: 0; }
  .pet-cat[data-mood="purr"] .eyes-purr, .pet-cat[data-mood="purr"] .mouth-purr { opacity: 1; }
  .pet-cat[data-mood="annoyed"] .eyes-open, .pet-cat[data-mood="annoyed"] .mouth-n { opacity: 0; }
  .pet-cat[data-mood="annoyed"] .eyes-annoyed, .pet-cat[data-mood="annoyed"] .mouth-annoyed { opacity: 1; }

  .moon-btn {
    position: absolute; top: 5%; right: 7%; font-size: 2.1rem; line-height: 1;
    background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .25s ease; filter: drop-shadow(0 0 10px rgba(255, 243, 208, .55));
  }
  .moon-btn.pulse { animation: moonPulse .5s ease; }
  @keyframes moonPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  .twinkle { position: absolute; border-radius: 50%; background: #FBF3DC; animation: pop .4s ease; }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); } }
  .star-btn {
    position: absolute; font-size: 1.25rem; line-height: 1; background: none; border: 0;
    cursor: pointer; -webkit-tap-highlight-color: transparent; transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 5px rgba(255, 235, 180, .8));
  }
  .star-btn.falling { animation: starFall .55s ease-in forwards; }
  @keyframes starFall { to { transform: translate(calc(-50% + 55px), calc(-50% + 90px)) scale(.3); opacity: 0; } }

  .ask-more {
    margin-top: 18px; padding: 14px 16px; border-radius: 18px;
    border: 2px dashed var(--line); background: rgba(244, 237, 216, .06);
  }
  .ask-more p { font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif; font-size: 1.1rem; margin: 0 0 12px; color: var(--amber); }
  .ask-more .actions { margin-top: 0; gap: 10px; }
  .ask-more .btn { min-width: 96px; min-height: 44px; padding: 8px 18px; font-size: .95rem; }

  .floatup { position: absolute; font-size: 1.5rem; pointer-events: none; animation: floatUp 1s ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -46px); } }

  .meter { width: min(100%, 340px); height: 14px; margin: 16px auto 0; border-radius: 99px; background: rgba(244, 237, 216, .18); overflow: hidden; }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--amber), #FF9E7A); transition: width .35s ease; }

  .hunt-obj {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 1.9rem; line-height: 1; background: none; border: 0; padding: 8px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    animation: float 2.6s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255, 196, 77, .45));
  }
  .hunt-obj.found { animation: none; transform: translate(-50%, -50%) scale(1.8); opacity: 0; transition: transform .4s ease, opacity .4s ease; }
  @keyframes float { 0%, 100% { margin-top: 0; } 50% { margin-top: -8px; } }

  .meteor-shower { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 25; }
  .meteor {
    position: absolute; top: -6%; width: 7px; height: 7px; border-radius: 50%;
    background: #FFF3D0; box-shadow: 0 0 10px 3px rgba(255, 196, 77, .75);
    animation: meteorFall var(--d) linear var(--dl) forwards;
  }
  @keyframes meteorFall {
    0%   { opacity: 1; }
    14%  { opacity: .15; }
    28%  { opacity: 1; }
    42%  { opacity: .15; }
    56%  { opacity: 1; }
    70%  { opacity: .15; }
    85%  { opacity: 1; }
    100% { transform: translate(var(--dx), 120vh); opacity: 0; }
  }

  /* ---- gift box ---- */
  .giftbox-wrap { margin: 22px 0 6px; }
  .giftbox { font-size: 5.2rem; line-height: 1; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .25s ease; touch-action: manipulation; }
  .giftbox:hover { transform: translateY(-3px); }
  .giftbox.open { transform: scale(1.12) rotate(-4deg); pointer-events: none; }
  .gift-lines { min-height: 96px; margin-top: 8px; }
  .gift-lines p {
    font-size: 1.08rem; line-height: 1.8; color: var(--text); margin: 0 0 6px;
    opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease;
  }
  .gift-lines p.show { opacity: 1; transform: none; }
  .gift-more { opacity: 0; transition: opacity .5s ease; }
  .gift-more.show { opacity: 1; }

  /* ---- scratch card ---- */
  .scratch {
    position: relative; width: min(100%, 380px); height: 160px;
    margin: 22px auto 0; border-radius: 20px; overflow: hidden;
    background: linear-gradient(180deg, #183149, #0F2233);
    border: 2px solid rgba(255, 196, 77, .5);
  }
  .scratch-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 14px 20px; text-align: center;
    font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif;
    font-size: clamp(1.25rem, 5vw, 1.6rem); line-height: 1.55; color: var(--amber);
  }
  .scratch canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    transition: opacity .6s ease;
  }
  .scratch canvas:focus-visible { outline: 3px solid var(--text); outline-offset: -3px; }
  .scratch canvas.gone { opacity: 0; pointer-events: none; }
  .scratch-hint { color: var(--muted); font-size: .92rem; margin-top: 10px; }

  .plead-stage { height: 240px; }
  .plead-line {
    font-family: "Sriracha", "Noto Sans Thai Looped", Tahoma, sans-serif;
    font-size: clamp(1.15rem, 4.6vw, 1.4rem); color: var(--amber);
    margin: 18px auto 0; max-width: 30ch; line-height: 1.6;
    opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease;
  }
  .plead-line.show { opacity: 1; transform: none; }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .confetti span { position: absolute; top: -10%; font-size: 1.4rem; animation: heartFall var(--d) linear var(--dl) forwards; }
  @keyframes heartFall { to { transform: translateY(120vh) rotate(var(--r)); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .tail-g, .floatup, .hunt-obj, .meteor, .confetti span, .moon-btn.pulse, .twinkle, .star-btn.falling { animation: none !important; }
    .plead-line { transition: none; }
    .scratch canvas, .gift-lines p, .gift-more, .giftbox, .btn { transition: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="minicat" viewBox="0 0 220 180">
    <path d="M44 66 L48 20 L100 44 Z M176 66 L172 20 L120 44 Z" fill="#0C0C12" stroke="#23233A" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="110" cy="90" rx="74" ry="58" fill="#0C0C12" stroke="#23233A" stroke-width="3"/>
    <circle cx="80" cy="86" r="13" fill="#FFC44D"/>
    <circle cx="140" cy="86" r="13" fill="#FFC44D"/>
    <ellipse cx="80" cy="86" rx="4" ry="10" fill="#0C0C12"/>
    <ellipse cx="140" cy="86" rx="4" ry="10" fill="#0C0C12"/>
    <path d="M104 104 L116 104 L110 110 Z" fill="#D9788F"/>
    <path d="M110 110 Q104 118 96 113 M110 110 Q116 118 124 113" stroke="#B9B4D6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g fill="#0C0C12" stroke="#23233A" stroke-width="3">
      <ellipse cx="84" cy="160" rx="22" ry="12"/>
      <g class="paw-r"><ellipse cx="136" cy="160" rx="22" ry="12"/></g>
    </g>
  </symbol>
  <symbol id="heart" viewBox="0 0 24 24">
    <path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#FF6F97"/>
  </symbol>
</svg>

<main>
  <div class="step" id="step"></div>
  <div id="view"></div>
</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="meteor-shower" id="meteors" aria-hidden="true"></div>

<script>
  var TOTAL = 5;
  var view = document.getElementById('view');
  var stepBox = document.getElementById('step');
  var confetti = document.getElementById('confetti');
  var meteorBox = document.getElementById('meteors');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function buildStep() {
    stepBox.textContent = '';
    for (var i = 1; i <= TOTAL; i++) stepBox.appendChild(document.createElement('span'));
  }
  function updateStep(n) {
    var spans = stepBox.children;
    for (var i = 0; i < spans.length; i++) spans[i].className = (i + 1 === n) ? 'on' : '';
  }

  function heartBurst() {
    if (reduceMotion) return;
    for (var i = 0; i < 20; i++) {
      var s = el('span', '', i % 2 ? '🖤' : '💛');
      s.style.left = (Math.random() * 96) + '%';
      s.style.setProperty('--d', (2.4 + Math.random() * 1.8) + 's');
      s.style.setProperty('--dl', (Math.random() * 0.8) + 's');
      s.style.setProperty('--r', (Math.random() * 360) + 'deg');
      confetti.appendChild(s);
    }
    setTimeout(function () { confetti.textContent = ''; }, 5000);
  }

  function meteorShower(done) {
    if (reduceMotion) { done(); return; }
    for (var i = 0; i < 16; i++) {
      var m = el('div', 'meteor');
      m.style.left = (Math.random() * 100) + '%';
      m.style.setProperty('--d', (0.7 + Math.random() * 0.5) + 's');
      m.style.setProperty('--dl', (Math.random() * 0.5) + 's');
      m.style.setProperty('--dx', (rand(40, 140)) + 'px');
      meteorBox.appendChild(m);
    }
    setTimeout(function () { meteorBox.textContent = ''; done(); }, 1400);
  }

  function miniCat(extraCls) {
    var wrap = el('div', 'mini-cat' + (extraCls ? ' ' + extraCls : ''));
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 220 180');
    svg.setAttribute('aria-hidden', 'true');
    var use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#minicat');
    svg.appendChild(use);
    wrap.appendChild(svg);
    return wrap;
  }
  function catSwipe(cat) {
    cat.classList.remove('swipe'); void cat.offsetWidth; cat.classList.add('swipe');
    cat.classList.add('bump'); setTimeout(function () { cat.classList.remove('bump'); }, 180);
  }

  /* ================= PAGE 1: เรียกแมว / เล่นกับแมว ================= */
  var CAT_SVG =
    '<svg viewBox="0 0 240 210" role="img" aria-label="แมวดำให้เล่นด้วย">' +
    '<ellipse cx="120" cy="150" rx="82" ry="56" fill="#0C0C12" stroke="#23233A" stroke-width="3"/>' +
    '<g class="tail-g">' +
      '<path d="M188 168 Q230 150 224 98 Q220 70 198 66" fill="none" stroke="#0C0C12" stroke-width="20" stroke-linecap="round"/>' +
      '<path class="hit-tail" d="M188 168 Q230 150 224 98 Q220 70 198 66" fill="none" stroke="#000" stroke-opacity="0" stroke-width="46" stroke-linecap="round" pointer-events="all"/>' +
    '</g>' +
    '<path d="M62 96 L66 34 L118 62 Z M178 96 L174 34 L122 62 Z" fill="#0C0C12" stroke="#23233A" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M73 86 L74 52 L104 68 Z M167 86 L166 52 L136 68 Z" fill="#3A2A44"/>' +
    '<circle cx="120" cy="98" r="58" fill="#0C0C12" stroke="#23233A" stroke-width="3"/>' +
    '<g class="eyes-open">' +
      '<circle cx="98" cy="94" r="10" fill="#FFC44D"/><circle cx="142" cy="94" r="10" fill="#FFC44D"/>' +
      '<ellipse cx="98" cy="94" rx="3.2" ry="8" fill="#0C0C12"/><ellipse cx="142" cy="94" rx="3.2" ry="8" fill="#0C0C12"/>' +
    '</g>' +
    '<g class="eyes-purr"><path d="M88 94 Q98 84 108 94 M132 94 Q142 84 152 94" stroke="#FFC44D" stroke-width="4.5" stroke-linecap="round" fill="none"/></g>' +
    '<g class="eyes-annoyed">' +
      '<path d="M86 84 L108 90 M154 84 L132 90" stroke="#FFC44D" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="98" cy="96" r="9" fill="#FFC44D"/><circle cx="142" cy="96" r="9" fill="#FFC44D"/>' +
    '</g>' +
    '<path d="M114 110 L126 110 L120 116 Z" fill="#D9788F"/>' +
    '<g class="mouth-n"><path d="M120 116 Q114 124 106 119 M120 116 Q126 124 134 119" stroke="#B9B4D6" stroke-width="3" stroke-linecap="round" fill="none"/></g>' +
    '<g class="mouth-purr"><path d="M104 120 Q120 132 136 120 Z" fill="#5B1F3A" stroke="#B9B4D6" stroke-width="2.5" stroke-linejoin="round"/></g>' +
    '<g class="mouth-annoyed"><path d="M108 120 Q120 113 132 120" stroke="#B9B4D6" stroke-width="3.5" stroke-linecap="round" fill="none"/></g>' +
    '<path d="M62 106 L26 100 M62 116 L26 120 M178 106 L214 100 M178 116 L214 120" stroke="#9A98B5" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>' +
    '<circle class="hit-head" cx="120" cy="98" r="60" fill="#000" fill-opacity="0" pointer-events="all"/>' +
    '<circle class="hit-ear" cx="150" cy="52" r="17" fill="#000" fill-opacity="0" pointer-events="all"/>' +
    '<circle class="hit-nose" cx="120" cy="113" r="15" fill="#000" fill-opacity="0" pointer-events="all"/>' +
    '</svg>';

  var PET_LINES = ['แมวหลับตาเคลิ้มมม', 'สบายมากเลยครับ', 'ชอบมากเลยครับ 😳', 'เพียว~'];
  var EAR_LINES = ['หางส่ายฟรุ้งฟริ้ง', 'จุดอ่อนเลยครับ', 'เขินนนน'];
  var TAIL_LINES = ['จับได้ละ!', 'หางส่ายรัวๆ', 'แมวหันมามองแปปนึง', 'ว่องไวมาก'];
  var NOSE_LINES = ['หงุดหงิดจัง 😂', 'อย่าจิ้มสิครับ!', 'แหนะ!'];
  var MOON_PHASES = ['🌙', '🌘', '🌗', '🌖', '🌕'];

  function spawnFloat(host, text, xPct) {
    var f = el('span', 'floatup', text);
    f.style.left = xPct + '%'; f.style.top = '4%';
    host.appendChild(f);
    setTimeout(function () { f.remove(); }, 1000);
  }

  function renderGame() {
    updateStep(1);
    view.textContent = '';

    var askWrap = el('div');
    askWrap.appendChild(el('h1', '', 'เรียกแมวดูไหมครับ?'));
    askWrap.appendChild(el('p', 'sub', 'ยินดีที่ได้พบคุณอีกครั้งครับฮาย 😳'));
    askWrap.appendChild(el('p', 'sub', 'มีแมวตัวนึงอยากเล่นกับคุณอยู่นะ 🥺'));
    var askActions = el('div', 'actions');
    var callBtn = el('button', 'btn btn-main', 'เรียกแมว 🐈');
    callBtn.type = 'button';
    askActions.appendChild(callBtn);
    askWrap.appendChild(askActions);
    view.appendChild(askWrap);

    callBtn.addEventListener('click', startPlayground);
  }

  function startPlayground() {
    view.textContent = '';
    view.appendChild(el('h1', '', 'ทักทายแมวหน่อยสิครับ'));
    view.appendChild(el('p', 'sub', 'ลูบหัว จับหาง จิ้มจมูก หรือแตะพระจันทร์กับดาวดูก็ได้นะครับ'));

    var stage = el('div', 'stage pet-stage');

    var moon = el('button', 'moon-btn', MOON_PHASES[0]);
    moon.type = 'button'; moon.setAttribute('aria-label', 'พระจันทร์');
    var moonIdx = 0;
    stage.appendChild(moon);

    var stars = [];
    var starSlots = [[10, 12], [24, 26], [76, 14], [90, 30]];
    starSlots.forEach(function (pos) {
      var s = el('button', 'star-btn', '✨');
      s.type = 'button'; s.setAttribute('aria-label', 'ดาว');
      s.style.left = pos[0] + '%'; s.style.top = pos[1] + '%';
      stage.appendChild(s);
      stars.push(s);
    });

    var catWrap = el('div', 'pet-cat');
    catWrap.innerHTML = CAT_SVG;
    stage.appendChild(catWrap);
    view.appendChild(stage);

    var askMore = null;
    view.appendChild(el('p', 'sub', 'เล่นด้วยกันแล้ว 0 ครั้ง', 'plays-line'));
    var playsLine = view.lastChild;
    playsLine.className = 'counter';

    var moodTimer = null;
    function setMood(m, ms) {
      catWrap.setAttribute('data-mood', m);
      clearTimeout(moodTimer);
      moodTimer = setTimeout(function () { catWrap.removeAttribute('data-mood'); }, ms || 500);
    }

    var plays = 0, nextPrompt = 5, finished = false;
    function played() {
      if (finished) return;
      plays++;
      playsLine.textContent = 'เล่นด้วยกันแล้ว ' + plays + ' ครั้ง';
      if (plays >= nextPrompt && !askMore) showAskMore();
    }

    function showAskMore() {
      askMore = el('div', 'ask-more');
      askMore.appendChild(el('p', '', 'เล่นกับผมเสร็จแล้วหรือยังครับ?'));
      var row = el('div', 'actions');
      var more = el('button', 'btn btn-alt', 'เล่นต่อ');
      more.type = 'button';
      var stop = el('a', 'btn btn-main', 'เล่นพอแล้วครับ');
      stop.href = '#hunt';
      row.appendChild(more); row.appendChild(stop);
      askMore.appendChild(row);
      view.appendChild(askMore);
      more.addEventListener('click', function () {
        askMore.remove(); askMore = null; nextPrompt = plays + 5;
      });
    }

    catWrap.querySelector('.hit-head').addEventListener('click', function () {
      flickTail();
      setMood('purr', 450);
      spawnFloat(catWrap, PET_LINES[Math.floor(Math.random() * PET_LINES.length)], 40);
      played();
    });
    function flickTail() {
      var tailG = catWrap.querySelector('.tail-g');
      if (!tailG) return;
      tailG.classList.remove('flick');
      void tailG.offsetWidth;
      tailG.classList.add('flick');
      clearTimeout(tailG._flickTimer);
      tailG._flickTimer = setTimeout(function () { tailG.classList.remove('flick'); }, 850);
    }
    catWrap.querySelector('.hit-ear').addEventListener('click', function () {
      flickTail();
      spawnFloat(catWrap, EAR_LINES[Math.floor(Math.random() * EAR_LINES.length)], 68);
      played();
    });
    catWrap.querySelector('.hit-tail').addEventListener('click', function () {
      flickTail();
      spawnFloat(catWrap, TAIL_LINES[Math.floor(Math.random() * TAIL_LINES.length)], 78);
      played();
    });
    catWrap.querySelector('.hit-nose').addEventListener('click', function () {
      flickTail();
      setMood('annoyed', 500);
      spawnFloat(catWrap, NOSE_LINES[Math.floor(Math.random() * NOSE_LINES.length)], 50);
      played();
    });

    var MAX_TWINKLE = 18, twinkles = [];
    moon.addEventListener('click', function () {
      flickTail();
      moonIdx = (moonIdx + 1) % MOON_PHASES.length;
      moon.textContent = MOON_PHASES[moonIdx];
      moon.classList.remove('pulse'); void moon.offsetWidth; moon.classList.add('pulse');
      for (var i = 0; i < 3; i++) {
        var t = el('div', 'twinkle');
        var sz = rand(1.5, 3);
        t.style.width = sz + 'px'; t.style.height = sz + 'px';
        t.style.left = rand(4, 96) + '%'; t.style.top = rand(4, 45) + '%';
        stage.insertBefore(t, moon);
        twinkles.push(t);
        if (twinkles.length > MAX_TWINKLE) twinkles.shift().remove();
      }
      played();
    });

    var starClicks = 0;
    stars.forEach(function (s) {
      s.addEventListener('click', function () {
        if (s.classList.contains('falling')) return;
        flickTail();
        s.classList.add('falling');
        played();
        starClicks++;
        if (starClicks % 5 === 0) meteorShower(function () {});
        setTimeout(function () {
          s.style.left = rand(8, 92) + '%';
          s.style.top = rand(8, 42) + '%';
          s.classList.remove('falling');
        }, 560);
      });
    });
  }

  /* ================= PAGE 2: SECRET HUNT ================= */
  function huntPositions() {
    var quads = [
      { x: [10, 40], y: [12, 42] }, { x: [60, 90], y: [12, 42] },
      { x: [10, 40], y: [56, 88] }, { x: [60, 90], y: [56, 88] }
    ];
    for (var i = quads.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = quads[i]; quads[i] = quads[j]; quads[j] = t; }
    var types = ['star', 'star', 'heart', 'heart'];
    for (i = types.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = types[i]; types[i] = types[j]; types[j] = t; }
    return quads.map(function (q, i) { return { type: types[i], left: rand(q.x[0], q.x[1]), top: rand(q.y[0], q.y[1]) }; });
  }

  function renderHunt() {
    updateStep(2);
    view.textContent = '';
    view.appendChild(el('h1', '', '🌙 Secret Hunt'));
    view.appendChild(el('p', 'sub', 'ผมซ่อนอะไรบางอย่างไว้ในคืนนี้ครับ ลองหาให้เจอทั้งหมดดูสิ'));

    var stage = el('div', 'stage');
    for (var i = 0; i < 12; i++) {
      var star = el('div', 'star-bg');
      var sz = rand(1, 2.4);
      star.style.width = sz + 'px'; star.style.height = sz + 'px';
      star.style.left = rand(4, 96) + '%'; star.style.top = rand(4, 90) + '%';
      stage.appendChild(star);
    }
    view.appendChild(stage);
    var counter = el('p', 'counter', 'เจอแล้ว 0 / 4');
    view.appendChild(counter);

    var found = 0;
    huntPositions().forEach(function (p) {
      var obj = el('button', 'hunt-obj', p.type === 'star' ? '⭐' : '❤️');
      obj.type = 'button';
      obj.style.left = p.left + '%'; obj.style.top = p.top + '%';
      obj.style.animationDelay = rand(0, 1.2) + 's';
      obj.setAttribute('aria-label', p.type === 'star' ? 'ดาว' : 'หัวใจ');
      obj.addEventListener('click', function onFound() {
        obj.removeEventListener('click', onFound);
        obj.classList.add('found');
        found++;
        counter.textContent = 'เจอแล้ว ' + found + ' / 4';
        if (found >= 4) {
          setTimeout(function () {
            meteorShower(function () {
              view.textContent = '';
              view.appendChild(el('h1', '', 'เก่งจังครับ 🖤'));
              view.appendChild(el('p', 'sub', 'ดูเหมือนคุณจะหาของที่ผมซ่อนได้เก่งกว่าที่คิดนะครับเบบี๋ ❤️'));
              var actions = el('div', 'actions');
              var go = el('a', 'btn btn-main', 'ไปต่อ');
              go.href = '#gift';
              actions.appendChild(go);
              view.appendChild(actions);
            });
          }, 350);
        }
      });
      stage.appendChild(obj);
    });
  }

  /* ================= PAGE 3: GIFT BOX ================= */
  function renderGift() {
    updateStep(3);
    view.textContent = '';
    view.appendChild(el('h1', '', 'มารับรางวัลคนเก่งเร็วครับ'));
    view.appendChild(el('p', 'sub', 'ผมมีของเล็ก ๆ จะให้'));

    var boxWrap = el('div', 'giftbox-wrap');
    var box = el('button', 'giftbox', '🎁');
    box.type = 'button';
    box.setAttribute('aria-label', 'เปิดกล่องของขวัญ');
    boxWrap.appendChild(box);
    view.appendChild(boxWrap);

    var lines = el('div', 'gift-lines');
    view.appendChild(lines);

    var more = el('p', 'gift-more', 'ยังมีอีกอย่างครับ…');
    view.appendChild(more);

    var actions = el('div', 'actions');
    var go = el('a', 'btn btn-main', 'ดูสิ่งสุดท้าย');
    go.href = '#plead';
    go.style.display = 'none';
    actions.appendChild(go);
    view.appendChild(actions);

    box.addEventListener('click', function open() {
      box.removeEventListener('click', open);
      box.classList.add('open');
      var texts = ['ของขวัญไม่มีอะไรหรอกครับ…', 'แค่ผมอยากให้คุณรู้ว่า', 'ผมชอบฮายนะครับ 😳'];
      texts.forEach(function (t, i) {
        setTimeout(function () {
          var p = el('p', '', t);
          lines.appendChild(p);
          requestAnimationFrame(function () { p.classList.add('show'); });
        }, 500 + i * 1100);
      });
      setTimeout(function () {
        more.classList.add('show');
        go.style.display = 'inline-flex';
        go.focus({ preventScroll: true });
      }, 500 + texts.length * 1100 + 500);
    });
  }

  /* ================= PAGE 4: แมวมาอ้อนก่อนพูดความในใจ ================= */
  function renderPlead() {
    updateStep(4);
    view.textContent = '';
    view.appendChild(el('h1', '', 'ฟังผมพูดอะไรหน่อยได้ไหมครับ 🥺'));
    view.appendChild(el('p', 'sub', 'ขอเวลาแป๊บเดียวเองครับ ผมมีอะไรอยากบอกจริง ๆ 🥺'));

    var stage = el('div', 'stage pet-stage plead-stage');
    var catWrap = el('div', 'pet-cat');
    catWrap.innerHTML = CAT_SVG;
    stage.appendChild(catWrap);
    view.appendChild(stage);

    // The pleading cat responds to every pet/tap with a tail wag too.
    function flickPleadTail() {
      var tailG = catWrap.querySelector('.tail-g');
      if (!tailG) return;
      tailG.classList.remove('flick');
      void tailG.offsetWidth;
      tailG.classList.add('flick');
      clearTimeout(tailG._flickTimer);
      tailG._flickTimer = setTimeout(function () { tailG.classList.remove('flick'); }, 850);
    }
    catWrap.querySelector('.hit-head').addEventListener('click', function () {
      flickPleadTail();
      catWrap.setAttribute('data-mood', 'purr');
      spawnFloat(catWrap, 'ลูบหัวอีกได้ไหมครับ 🥺', 40);
      setTimeout(function () { catWrap.removeAttribute('data-mood'); }, 500);
    });
    catWrap.querySelector('.hit-ear').addEventListener('click', function () {
      flickPleadTail();
      spawnFloat(catWrap, 'ตรงนั้นจั๊กจี้ครับ 😳', 65);
    });
    catWrap.querySelector('.hit-tail').addEventListener('click', function () {
      flickPleadTail();
      spawnFloat(catWrap, 'หางผมส่ายแล้วครับ 💛', 75);
    });
    catWrap.querySelector('.hit-nose').addEventListener('click', function () {
      flickPleadTail();
      catWrap.setAttribute('data-mood', 'annoyed');
      spawnFloat(catWrap, 'แง อย่าจิ้มจมูกสิครับ 😂', 50);
      setTimeout(function () { catWrap.removeAttribute('data-mood'); }, 500);
    });

    var actions = el('div', 'actions');
    var go = el('a', 'btn btn-main', 'ฟังครับ');
    go.href = '#final';
    actions.appendChild(go);
    view.appendChild(actions);
  }

  /* ================= PAGE 4: FINAL SECRET (scratch, reveal ~80%) ================= */
  function paintFoil(ctx, W, H) {
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#DCD3B4'); g.addColorStop(0.45, '#B4AB8B'); g.addColorStop(1, '#D3CAAA');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.rotate(-0.35); ctx.fillStyle = 'rgba(255,255,255,.16)';
    for (var i = -2; i < 9; i++) ctx.fillRect(i * 70, -40, 22, H * 2.4);
    ctx.restore();
    for (var s = 0; s < 420; s++) {
      ctx.fillStyle = s % 2 ? 'rgba(255,255,255,.18)' : 'rgba(40,30,10,.10)';
      ctx.fillRect(Math.random() * W, Math.random() * H, 1.6, 1.6);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, W - 2, H - 2);
  }

  function makeScratch(wrap, canvas, threshold, onReveal) {
    var ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx) { canvas.classList.add('gone'); onReveal(); return; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = wrap.getBoundingClientRect();
    var W = Math.max(1, Math.round(rect.width)), H = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.scale(dpr, dpr);
    paintFoil(ctx, W, H);

    var drawing = false, last = null, done = false, lastCheck = 0;
    var BRUSH = 34;

    function pos(e) {
      var r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (W / (r.width || W)), y: (e.clientY - r.top) * (H / (r.height || H)) };
    }
    function stroke(a, b) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = BRUSH; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    function ratio() {
      var w = canvas.width, h = canvas.height;
      var data = ctx.getImageData(0, 0, w, h).data;
      var step = 4, total = 0, clear = 0;
      for (var y = 0; y < h; y += step) for (var x = 0; x < w; x += step) { total++; if (data[(y * w + x) * 4 + 3] < 32) clear++; }
      return total ? clear / total : 0;
    }
    function reveal() { if (done) return; done = true; drawing = false; canvas.classList.add('gone'); onReveal(); }
    function check(force) {
      if (done) return;
      var now = Date.now();
      if (!force && now - lastCheck < 120) return;
      lastCheck = now;
      if (ratio() >= threshold) reveal();
    }
    function end() { if (!drawing) return; drawing = false; last = null; check(true); }

    canvas.addEventListener('pointerdown', function (e) {
      if (done) return;
      drawing = true; last = pos(e); stroke(last, last);
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drawing || done) return;
      if (e.pointerType === 'mouse' && e.buttons === 0) { end(); return; }
      var p = pos(e); stroke(last, p); last = p; check(false);
      e.preventDefault();
    });
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } });
  }

  function renderFinal() {
    updateStep(5);
    view.textContent = '';
    view.appendChild(el('h1', '', 'ขอพื้นที่พูดอะไรหน่อยครับ'));
    view.appendChild(el('p', 'sub', 'ถึงเวลาที่ผมอยากพูดจริง ๆ แล้วครับ'));

    var wrap = el('div', 'scratch');
    var msg = el('div', 'scratch-msg', 'ผมชอบคุณ > 100 อีกนะ ยินดีที่ได้ตกหลุมที่คุณขุดไว้นะครับ 😳');
    var canvas = document.createElement('canvas');
    canvas.tabIndex = 0;
    canvas.setAttribute('aria-label', 'ขูดเพื่อเปิดข้อความ');
    wrap.appendChild(msg); wrap.appendChild(canvas);
    view.appendChild(wrap);
    view.appendChild(el('p', 'scratch-hint', 'ลองขูดที่กล่องด้านบนดูสิครับ'));

    makeScratch(wrap, canvas, 0.8, function () {
      view.querySelector('.scratch-hint').remove();
      heartBurst();
      var plead = el('p', 'plead-line', 'ตกหลุมรักผมได้แล้วมั้งครับเบบี๋ 🖤');
      view.appendChild(plead);
      requestAnimationFrame(function () { plead.classList.add('show'); });
    });
  }

  /* ================= route ================= */
  var PAGES = { play: renderGame, hunt: renderHunt, gift: renderGift, plead: renderPlead, final: renderFinal };
  function route() {
    var h = (location.hash || '').replace('#', '');
    (PAGES[h] || renderGame)();
  }

  buildStep();
  window.addEventListener('hashchange', route);
  route();
</script>
