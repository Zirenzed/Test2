<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="เล่นกับแมว ตามหาความลับ แล้วเปิดของขวัญ">
<meta name="theme-color" content="#12283B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>เล่นกับแมว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Noto+Sans+Thai+Looped:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sky-top:#12283B;--sky-bottom:#21446A;--text:#F4EDD8;--muted:#B3C0D2;--amber:#FFC44D;--amber-ink:#2A1A00;--line:rgba(244,237,216,.4);--dot:rgba(244,237,216,.28);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky-top:#0A1521;--sky-bottom:#162C44}}
:root[data-theme="dark"]{--sky-top:#0A1521;--sky-bottom:#162C44}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom)) fixed;color:var(--text);font-family:"Noto Sans Thai Looped","Sarabun",Tahoma,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;padding:28px 20px;overscroll-behavior:none}
main{width:100%;max-width:440px;text-align:center}
@media(min-width:860px){main{max-width:560px}}
.step{display:flex;justify-content:center;gap:8px;margin:0 0 16px}
.step span{width:8px;height:8px;border-radius:99px;background:var(--dot);transition:width .2s,background .2s}
.step span.on{width:26px;background:var(--amber)}
h1{font-family:"Sriracha","Noto Sans Thai Looped",Tahoma,sans-serif;font-weight:400;font-size:clamp(1.7rem,6.6vw,2.4rem);line-height:1.4;margin:4px 0 6px;text-wrap:balance}
.sub{font-size:1rem;line-height:1.75;color:var(--muted);margin:0 auto 6px;max-width:32ch}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:116px;padding:10px 24px;border-radius:999px;font:600 1rem "Noto Sans Thai Looped",Tahoma,sans-serif;text-decoration:none;cursor:pointer;border:2px solid transparent;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .15s,filter .15s}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.btn-main{background:var(--amber);color:var(--amber-ink)}
.btn-alt{background:rgba(244,237,216,.1);border-color:var(--line);color:var(--text)}
.btn-main:hover,.btn-alt:hover{filter:brightness(1.08);transform:translateY(-2px)}
.actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.counter{font-weight:600;color:var(--amber);margin:10px 0 0}
.stage{position:relative;width:100%;max-width:380px;height:260px;margin:18px auto 0;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 30% 15%,#23456B,transparent 60%),linear-gradient(180deg,#16324B,#0E2338);border:2px solid rgba(255,196,77,.38)}
.stage .star-bg{position:absolute;border-radius:50%;background:#FBF3DC;opacity:.5}
.pet-stage{height:300px;display:flex;align-items:flex-end;justify-content:center}
.pet-cat{width:min(72%,230px);position:relative;z-index:1}
.pet-cat svg{width:100%;height:auto;display:block;overflow:visible}
.hit-head,.hit-tail,.hit-ear,.hit-nose{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tail-g{transform-box:fill-box;transform-origin:0% 100%;animation:tailSwish 1.6s ease-in-out infinite}
.tail-g.flick{animation:tailFlick .4s ease-in-out 2}
@keyframes tailSwish{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes tailFlick{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(20deg)}}
.eyes-open,.eyes-purr,.eyes-annoyed,.mouth-n,.mouth-purr,.mouth-annoyed{transition:opacity .12s}
.eyes-purr,.mouth-purr,.eyes-annoyed,.mouth-annoyed{opacity:0}
.pet-cat[data-mood="purr"] .eyes-open,.pet-cat[data-mood="purr"] .mouth-n,.pet-cat[data-mood="annoyed"] .eyes-open,.pet-cat[data-mood="annoyed"] .mouth-n{opacity:0}
.pet-cat[data-mood="purr"] .eyes-purr,.pet-cat[data-mood="purr"] .mouth-purr,.pet-cat[data-mood="annoyed"] .eyes-annoyed,.pet-cat[data-mood="annoyed"] .mouth-annoyed{opacity:1}
.moon-btn{position:absolute;top:5%;right:7%;font-size:2.1rem;line-height:1;background:none;border:0;cursor:pointer;z-index:2;filter:drop-shadow(0 0 10px rgba(255,243,208,.55))}
.moon-btn.pulse{animation:moonPulse .5s ease}
@keyframes moonPulse{50%{transform:scale(1.25)}}
.star-btn{position:absolute;font-size:1.25rem;line-height:1;background:none;border:0;cursor:pointer;transform:translate(-50%,-50%);z-index:2}
.star-btn.falling{animation:starFall .55s ease-in forwards}
@keyframes starFall{to{transform:translate(calc(-50% + 55px),calc(-50% + 90px)) scale(.3);opacity:0}}
.twinkle{position:absolute;border-radius:50%;background:#FBF3DC;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.3);opacity:1}100%{transform:scale(1)}}
.floatup{position:absolute;font-size:1.1rem;pointer-events:none;animation:floatUp 1s ease-out forwards;white-space:nowrap;z-index:4}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-46px)}}
.ask-more{margin-top:18px;padding:14px 16px;border-radius:18px;border:2px dashed var(--line);background:rgba(244,237,216,.06)}
.ask-more p{font-family:"Sriracha",sans-serif;font-size:1.1rem;margin:0 0 12px;color:var(--amber)}
.ask-more .actions{margin-top:0}
.hunt-obj{position:absolute;transform:translate(-50%,-50%);font-size:1.9rem;line-height:1;background:none;border:0;padding:8px;cursor:pointer;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,196,77,.45))}
.hunt-obj.found{animation:none;transform:translate(-50%,-50%) scale(1.8);opacity:0;transition:transform .4s,opacity .4s}
@keyframes float{0%,100%{margin-top:0}50%{margin-top:-8px}}
.meteor-shower,.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:25}
.meteor{position:absolute;top:-6%;width:7px;height:7px;border-radius:50%;background:#FFF3D0;box-shadow:0 0 10px 3px rgba(255,196,77,.75);animation:meteorFall var(--d) linear var(--dl) forwards}
@keyframes meteorFall{100%{transform:translate(var(--dx),120vh);opacity:0}}
.confetti span{position:absolute;top:-10%;font-size:1.4rem;animation:heartFall var(--d) linear var(--dl) forwards}
@keyframes heartFall{to{transform:translateY(120vh) rotate(var(--r));opacity:0}}
.giftbox-wrap{margin:22px 0 6px}
.giftbox{font-size:5.2rem;line-height:1;background:none;border:0;cursor:pointer;transition:transform .25s;touch-action:manipulation}
.giftbox:hover{transform:translateY(-3px)}
.giftbox.open{transform:scale(1.12) rotate(-4deg);pointer-events:none}
.gift-lines{min-height:96px;margin-top:8px}
.gift-lines p{font-size:1.08rem;line-height:1.8;color:var(--text);margin:0 0 6px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.gift-lines p.show{opacity:1;transform:none}
.gift-more{opacity:0;transition:opacity .5s}
.gift-more.show{opacity:1}
.score-card{width:min(100%,380px);margin:18px auto 0;padding:0;text-align:center}
.score-title{margin:0 0 10px;font-size:1.05rem;line-height:1.6}
.score-value{display:block;color:var(--amber);font-family:"Sriracha",sans-serif;font-size:clamp(3.4rem,14vw,4.6rem);font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums;margin:4px 0 8px}
.score-slider{-webkit-appearance:none;appearance:none;--pct:50%;width:100%;height:36px;margin:10px 0 0;padding:0;background:transparent;cursor:pointer;touch-action:pan-y}
.score-slider::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--amber) var(--pct),rgba(244,237,216,.22) var(--pct))}
.score-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;margin-top:-11px;border-radius:50%;background:var(--amber);border:3px solid #FFF3D0;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.score-slider::-moz-range-track{height:12px;border-radius:99px;background:rgba(244,237,216,.22)}
.score-slider::-moz-range-progress{height:12px;border-radius:99px;background:var(--amber)}
.score-slider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--amber);border:3px solid #FFF3D0;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.score-slider:focus-visible{outline:3px solid var(--text);outline-offset:6px;border-radius:99px}
.score-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:2px}
.score-popup{min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,196,77,.12);color:var(--amber);line-height:1.7}
.scratch{position:relative;width:min(100%,380px);height:160px;margin:22px auto 0;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#183149,#0F2233);border:2px solid rgba(255,196,77,.5)}
.scratch-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px 20px;text-align:center;font-family:"Sriracha",sans-serif;font-size:clamp(1.25rem,5vw,1.6rem);line-height:1.55;color:var(--amber)}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none;transition:opacity .6s}
.scratch canvas.gone{opacity:0;pointer-events:none}
.scratch-hint{color:var(--muted);font-size:.92rem;margin-top:10px}
.plead-line{font-family:"Sriracha",sans-serif;font-size:clamp(1.15rem,4.6vw,1.4rem);color:var(--amber);margin:18px auto 0;max-width:30ch;line-height:1.6;opacity:0;transform:translateY(6px);transition:opacity .6s,transform .6s}
.plead-line.show{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main><div class="step" id="step" aria-label="ความคืบหน้า"></div><div id="view"></div></main>
<div class="confetti" id="confetti" aria-hidden="true"></div><div class="meteor-shower" id="meteors" aria-hidden="true"></div>
<script>
'use strict';
const TOTAL=6;
const view=document.getElementById('view'),stepBox=document.getElementById('step');
const confetti=document.getElementById('confetti'),meteorBox=document.getElementById('meteors');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=(tag,cls='',text='')=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=='')e.textContent=text;return e};
const rand=(a,b)=>a+Math.random()*(b-a);
function buildStep(){stepBox.textContent='';for(let i=1;i<=TOTAL;i++)stepBox.appendChild(document.createElement('span'))}
function updateStep(n){[...stepBox.children].forEach((s,i)=>s.className=i===n-1?'on':'')}
function heartBurst(){if(reduceMotion)return;for(let i=0;i<20;i++){const s=el('span','',i%2?'🖤':'💛');s.style.left=rand(0,96)+'%';s.style.setProperty('--d',rand(2.4,4.2)+'s');s.style.setProperty('--dl',rand(0,.8)+'s');s.style.setProperty('--r',rand(0,360)+'deg');confetti.appendChild(s)}setTimeout(()=>confetti.replaceChildren(),5000)}
function meteorShower(done=()=>{}){if(reduceMotion){done();return}for(let i=0;i<16;i++){const m=el('div','meteor');m.style.left=rand(0,100)+'%';m.style.setProperty('--d',rand(.7,1.2)+'s');m.style.setProperty('--dl',rand(0,.5)+'s');m.style.setProperty('--dx',rand(40,140)+'px');meteorBox.appendChild(m)}setTimeout(()=>{meteorBox.replaceChildren();done()},1400)}
const CAT_SVG='<svg viewBox="0 0 240 210" role="img" aria-label="แมวดำให้เล่นด้วย"><ellipse cx="120" cy="150" rx="82" ry="56" fill="#0C0C12" stroke="#23233A" stroke-width="3"/><g class="tail-g"><path d="M188 168 Q230 150 224 98 Q220 70 198 66" fill="none" stroke="#0C0C12" stroke-width="20" stroke-linecap="round"/><path class="hit-tail" d="M188 168 Q230 150 224 98 Q220 70 198 66" fill="none" stroke="#000" stroke-opacity="0" stroke-width="46" stroke-linecap="round" pointer-events="all"/></g><path d="M62 96 L66 34 L118 62 Z M178 96 L174 34 L122 62 Z" fill="#0C0C12" stroke="#23233A" stroke-width="3" stroke-linejoin="round"/><path d="M73 86 L74 52 L104 68 Z M167 86 L166 52 L136 68 Z" fill="#3A2A44"/><circle cx="120" cy="98" r="58" fill="#0C0C12" stroke="#23233A" stroke-width="3"/><g class="eyes-open"><circle cx="98" cy="94" r="10" fill="#FFC44D"/><circle cx="142" cy="94" r="10" fill="#FFC44D"/><ellipse cx="98" cy="94" rx="3.2" ry="8" fill="#0C0C12"/><ellipse cx="142" cy="94" rx="3.2" ry="8" fill="#0C0C12"/></g><g class="eyes-purr"><path d="M88 94 Q98 84 108 94 M132 94 Q142 84 152 94" stroke="#FFC44D" stroke-width="4.5" stroke-linecap="round" fill="none"/></g><g class="eyes-annoyed"><path d="M86 84 L108 90 M154 84 L132 90" stroke="#FFC44D" stroke-width="4" stroke-linecap="round"/><circle cx="98" cy="96" r="9" fill="#FFC44D"/><circle cx="142" cy="96" r="9" fill="#FFC44D"/></g><path d="M114 110 L126 110 L120 116 Z" fill="#D9788F"/><g class="mouth-n"><path d="M120 116 Q114 124 106 119 M120 116 Q126 124 134 119" stroke="#B9B4D6" stroke-width="3" stroke-linecap="round" fill="none"/></g><g class="mouth-purr"><path d="M104 120 Q120 132 136 120 Z" fill="#5B1F3A" stroke="#B9B4D6" stroke-width="2.5"/></g><g class="mouth-annoyed"><path d="M108 120 Q120 113 132 120" stroke="#B9B4D6" stroke-width="3.5" stroke-linecap="round" fill="none"/></g><path d="M62 106 L26 100 M62 116 L26 120 M178 106 L214 100 M178 116 L214 120" stroke="#9A98B5" stroke-width="2.6" stroke-linecap="round"/><circle class="hit-head" cx="120" cy="98" r="60" fill="#000" fill-opacity="0" pointer-events="all"/><circle class="hit-ear" cx="150" cy="52" r="17" fill="#000" fill-opacity="0" pointer-events="all"/><circle class="hit-nose" cx="120" cy="113" r="15" fill="#000" fill-opacity="0" pointer-events="all"/></svg>';
function spawnFloat(host,text,x){const f=el('span','floatup',text);f.style.left=x+'%';f.style.top='4%';host.appendChild(f);setTimeout(()=>f.remove(),1000)}
function flickTail(cat){const tail=cat.querySelector('.tail-g');if(!tail)return;tail.classList.remove('flick');void tail.offsetWidth;tail.classList.add('flick');clearTimeout(tail._timer);tail._timer=setTimeout(()=>tail.classList.remove('flick'),850)}
function attachCatInteractions(cat,pleading=false){
 const pets=[['.hit-head',pleading?'ลูบหัวอีกได้ไหมครับ 🥺':['แมวหลับตาเคลิ้มมม','สบายมากเลยครับ','ชอบมากเลยครับ 😳','เพียว~'],40,'purr'],['.hit-ear',pleading?'ตรงนั้นจั๊กจี้ครับ 😳':['หางส่ายฟรุ้งฟริ้ง','จุดอ่อนเลยครับ','เขินนนน'],66,''],['.hit-tail',pleading?'หางผมส่ายแล้วครับ 💛':['จับได้ละ!','หางส่ายรัวๆ','แมวหันมามองแปปนึง','ว่องไวมาก'],78,''],['.hit-nose',pleading?'แง อย่าจิ้มจมูกสิครับ 😂':['หงุดหงิดจัง 😂','อย่าจิ้มสิครับ!','แหนะ!'],50,'annoyed']];
 pets.forEach(([sel,lines,x,mood])=>{const target=cat.querySelector(sel);if(!target)return;target.addEventListener('click',()=>{flickTail(cat);if(mood){cat.dataset.mood=mood;setTimeout(()=>{if(cat.dataset.mood===mood)delete cat.dataset.mood},500)}const line=Array.isArray(lines)?lines[Math.floor(Math.random()*lines.length)]:lines;spawnFloat(cat,line,x)})})
}
function renderGame(){
 updateStep(1);view.replaceChildren();
 view.append(el('h1','','เรียกแมวดูไหมครับ?'),el('p','sub','ยินดีที่ได้พบคุณอีกครั้งครับฮาย 😳'),el('p','sub','มีแมวตัวนึงอยากเล่นกับคุณอยู่นะ 🥺'));
 const actions=el('div','actions'),btn=el('button','btn btn-main','เรียกแมว 🐈');btn.type='button';actions.append(btn);view.append(actions);
 btn.addEventListener('click',startPlayground)
}
function startPlayground(){
 view.replaceChildren();view.append(el('h1','','ทักทายแมวหน่อยสิครับ'),el('p','sub','ลูบหัว จับหาง จิ้มจมูก หรือแตะพระจันทร์กับดาวดูก็ได้นะครับ'));
 const stage=el('div','stage pet-stage'),moon=el('button','moon-btn','🌙');moon.type='button';moon.setAttribute('aria-label','พระจันทร์');stage.append(moon);
 const phases=['🌙','🌘','🌗','🌖','🌕'];let moonIdx=0,plays=0,nextPrompt=5,askMore=null;
 [[10,12],[24,26],[76,14],[90,30]].forEach(pos=>{const s=el('button','star-btn','✨');s.type='button';s.setAttribute('aria-label','ดาว');s.style.left=pos[0]+'%';s.style.top=pos[1]+'%';stage.append(s);s.addEventListener('click',()=>{if(s.classList.contains('falling'))return;flickTail(cat);s.classList.add('falling');played();setTimeout(()=>{s.style.left=rand(8,92)+'%';s.style.top=rand(8,42)+'%';s.classList.remove('falling')},560)})});
 const cat=el('div','pet-cat');cat.innerHTML=CAT_SVG;stage.append(cat);view.append(stage);
 const counter=el('p','counter','เล่นด้วยกันแล้ว 0 ครั้ง');view.append(counter);
 function played(){plays++;counter.textContent='เล่นด้วยกันแล้ว '+plays+' ครั้ง';if(plays>=nextPrompt&&!askMore)showAskMore()}
 function showAskMore(){askMore=el('div','ask-more');askMore.append(el('p','','เล่นกับผมเสร็จแล้วหรือยังครับ?'));const row=el('div','actions'),more=el('button','btn btn-alt','เล่นต่อ'),stop=el('a','btn btn-main','เล่นพอแล้วครับ');more.type='button';stop.href='#hunt';row.append(more,stop);askMore.append(row);view.append(askMore);more.addEventListener('click',()=>{askMore.remove();askMore=null;nextPrompt=plays+5})}
 attachCatInteractions(cat);
 // Count cat taps, while preserving the individual reactions.
 ['.hit-head','.hit-ear','.hit-tail','.hit-nose'].forEach(sel=>cat.querySelector(sel).addEventListener('click',played));
 moon.addEventListener('click',()=>{flickTail(cat);moonIdx=(moonIdx+1)%phases.length;moon.textContent=phases[moonIdx];moon.classList.remove('pulse');void moon.offsetWidth;moon.classList.add('pulse');for(let i=0;i<3;i++){const t=el('div','twinkle');const size=rand(1.5,3);t.style.width=size+'px';t.style.height=size+'px';t.style.left=rand(4,96)+'%';t.style.top=rand(4,45)+'%';stage.insertBefore(t,moon);setTimeout(()=>t.remove(),1200)}played()})
}
function huntPositions(){const quads=[{x:[10,40],y:[12,42]},{x:[60,90],y:[12,42]},{x:[10,40],y:[56,88]},{x:[60,90],y:[56,88]}];for(let i=quads.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[quads[i],quads[j]]=[quads[j],quads[i]]}const types=['⭐','⭐','❤️','❤️'];for(let i=types.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[types[i],types[j]]=[types[j],types[i]]}return quads.map((q,i)=>({icon:types[i],left:rand(q.x[0],q.x[1]),top:rand(q.y[0],q.y[1])}))}
function renderHunt(){
 updateStep(2);view.replaceChildren();view.append(el('h1','','🌙 Secret Hunt'),el('p','sub','ผมซ่อนอะไรบางอย่างไว้ในคืนนี้ครับ ลองหาให้เจอทั้งหมดดูสิ'));
 const stage=el('div','stage');for(let i=0;i<12;i++){const s=el('div','star-bg'),size=rand(1,2.4);s.style.width=size+'px';s.style.height=size+'px';s.style.left=rand(4,96)+'%';s.style.top=rand(4,90)+'%';stage.append(s)}view.append(stage);
 const counter=el('p','counter','เจอแล้ว 0 / 4');view.append(counter);let found=0;
 huntPositions().forEach(p=>{const obj=el('button','hunt-obj',p.icon);obj.type='button';obj.style.left=p.left+'%';obj.style.top=p.top+'%';obj.setAttribute('aria-label',p.icon==='⭐'?'ดาว':'หัวใจ');stage.append(obj);obj.addEventListener('click',()=>{if(obj.disabled)return;obj.disabled=true;obj.classList.add('found');found++;counter.textContent='เจอแล้ว '+found+' / 4';if(found===4)setTimeout(()=>meteorShower(()=>{view.replaceChildren();view.append(el('h1','','เก่งจังครับ 🖤'),el('p','sub','ดูเหมือนคุณจะหาของที่ผมซ่อนได้เก่งกว่าที่คิดนะครับเบบี๋ ❤️'));const a=el('div','actions'),go=el('a','btn btn-main','ไปต่อ');go.href='#gift';a.append(go);view.append(a)}),450)})})
}

 updateStep(3);view.replaceChildren();view.append(el('h1','','มารับรางวัลคนเก่งเร็วครับ'),el('p','sub','ผมมีของเล็ก ๆ จะให้'));
 const boxWrap=el('div','giftbox-wrap'),box=el('button','giftbox','🎁');box.type='button';box.setAttribute('aria-label','เปิดกล่องของขวัญ');boxWrap.append(box);view.append(boxWrap);
 const lines=el('div','gift-lines'),more=el('p','gift-more','ยังมีอีกอย่างครับ…'),actions=el('div','actions'),go=el('a','btn btn-main','ดูสิ่งสุดท้าย');go.href='#plead';go.hidden=true;actions.append(go);view.append(lines,more,actions);
 box.addEventListener('click',()=>{box.disabled=true;box.classList.add('open');['ของขวัญไม่มีอะไรหรอกครับ…','แค่ผมอยากให้คุณรู้ว่า','ผมชอบฮายนะครับ 😳'].forEach((t,i)=>setTimeout(()=>{const p=el('p','',t);lines.append(p);requestAnimationFrame(()=>p.classList.add('show'))},500+i*1100));setTimeout(()=>{more.classList.add('show');go.hidden=false;go.focus({preventScroll:true})},4300)})

function renderPlead(){
 updateStep(4);view.replaceChildren();view.append(el('h1','','ฟังผมพูดอะไรหน่อยได้ไหมครับ 🥺'),el('p','sub','ขอเวลาแป๊บเดียวเองครับ ผมมีอะไรอยากบอกจริง ๆ 🥺'));

function renderScore(){
 updateStep(5);view.replaceChildren();view.append(el('h1','','ช่วยบอกผมทีว่าชอบแค่ไหน จาก 0-100? 🥺'));
 const card=el('section','score-card');card.append(el('p','score-title','ช่วยบอกผมทีว่าชอบแค่ไหน จาก 0-100'));
 const output=el('output','score-value','50');output.setAttribute('aria-live','polite');card.append(output);
 const slider=el('input','score-slider');slider.type='range';slider.min='0';slider.max='100';slider.value='50';slider.step='1';slider.setAttribute('aria-label','ระดับความชอบ 0 ถึง 100');card.append(slider);
 const scale=el('div','score-scale');scale.append(el('span','','0'),el('span','','100'));card.append(scale);
 const popup=el('div','score-popup','แบบนี้แปลว่าตกหลุมลงมาข้างนึงละนะ 🤭');popup.setAttribute('aria-live','polite');card.append(popup);view.append(card);
 function update(){const score=Number(slider.value);slider.style.setProperty('--pct',score+'%');output.textContent=String(score);popup.textContent=score<=25?'ชอบน้อยๆแต่ชอบนานๆก็ได้นะครับ ☺️':score<=50?'แบบนี้แปลว่าตกหลุมลงมาข้างนึงละนะ 🤭':score<=75?'อีกครึ่งนึงจะลงมาตอนไหนครับ ให้ช่วยดึงไหม 😳':'หลวมตัวลงมาแล้ว ไม่ให้ขึ้นไปแล้วนะครับ 😳'}
 slider.addEventListener('input',update);update();
 const actions=el('div','actions'),go=el('a','btn btn-main','ไปขูดเปิดข้อความลับ ✨');go.href='#final';actions.append(go);view.append(actions)
}
function paintFoil(ctx,W,H){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#DCD3B4');g.addColorStop(.45,'#B4AB8B');g.addColorStop(1,'#D3CAAA');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.rotate(-.35);ctx.fillStyle='rgba(255,255,255,.16)';for(let i=-2;i<9;i++)ctx.fillRect(i*70,-40,22,H*2.4);ctx.restore();for(let s=0;s<420;s++){ctx.fillStyle=s%2?'rgba(255,255,255,.18)':'rgba(40,30,10,.10)';ctx.fillRect(Math.random()*W,Math.random()*H,1.6,1.6)}ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2)}
function makeScratch(wrap,canvas,threshold,onReveal){
 const ctx=canvas.getContext&&canvas.getContext('2d');if(!ctx){canvas.classList.add('gone');onReveal();return}
 const dpr=Math.min(window.devicePixelRatio||1,2),rect=wrap.getBoundingClientRect(),W=Math.max(1,Math.round(rect.width)),H=Math.max(1,Math.round(rect.height));canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.scale(dpr,dpr);paintFoil(ctx,W,H);
 let drawing=false,last=null,done=false,lastCheck=0;const BRUSH=34;
 function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/(r.width||W)),y:(e.clientY-r.top)*(H/(r.height||H))}}
 function stroke(a,b){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='#000';ctx.lineWidth=BRUSH;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 function ratio(){const w=canvas.width,h=canvas.height,data=ctx.getImageData(0,0,w,h).data;let total=0,clear=0;for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4){total++;if(data[(y*w+x)*4+3]<32)clear++}return total?clear/total:0}
 function reveal(){if(done)return;done=true;drawing=false;canvas.classList.add('gone');onReveal()}
 function check(force=false){if(done)return;const now=Date.now();if(!force&&now-lastCheck<120)return;lastCheck=now;if(ratio()>=threshold)reveal()}
 function end(){if(!drawing)return;drawing=false;last=null;check(true)}
 canvas.addEventListener('pointerdown',e=>{if(done)return;drawing=true;last=pos(e);stroke(last,last);try{canvas.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
 canvas.addEventListener('pointermove',e=>{if(!drawing||done)return;if(e.pointerType==='mouse'&&e.buttons===0){end();return}const p=pos(e);stroke(last,p);last=p;check();e.preventDefault()});
 canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal()}})
}
function renderFinal(){
 updateStep(6);view.replaceChildren();view.append(el('h1','','ขอพื้นที่พูดอะไรหน่อยครับ'),el('p','sub','ถึงเวลาที่ผมอยากพูดจริง ๆ แล้วครับ'));
 const wrap=el('div','scratch'),msg=el('div','scratch-msg','ผมชอบคุณ > 100 อีกนะ ยินดีที่ได้ตกหลุมที่คุณขุดไว้นะครับ 😳'),canvas=document.createElement('canvas');canvas.tabIndex=0;canvas.setAttribute('aria-label','ขูดเพื่อเปิดข้อความ');wrap.append(msg,canvas);view.append(wrap,el('p','scratch-hint','ลองขูดที่กล่องด้านบนดูสิครับ'));
 makeScratch(wrap,canvas,.8,()=>{const hint=view.querySelector('.scratch-hint');if(hint)hint.remove();heartBurst();const line=el('p','plead-line','ตกหลุมรักผมได้แล้วมั้งครับเบบี๋ 🖤');view.append(line);requestAnimationFrame(()=>line.classList.add('show'))})
}
const PAGES={play:renderGame,hunt:renderHunt,gift:renderGift,plead:renderPlead,score:renderScore,final:renderFinal};
